name: Build & Release Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Android Platforms and Install Dependencies
        run: |
          cd flutter_app
          # Generate latest Android platform wrappers dynamically to avoid missing file errors
          flutter create . --platforms=android --org com.proxymama
          flutter pub get

      - name: Build APK (Release supporting all ABIs/Architectures)
        run: |
          cd flutter_app
          # Compile with fat APK configuration supporting ARM 32-bit, ARM 64-bit, and x64
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxymama-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
