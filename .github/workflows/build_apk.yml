name: Build & Release Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Android Platforms and Install Dependencies
        run: |
          cd flutter_app
          # Generate latest Android platform wrappers dynamically to avoid missing file errors
          flutter create . --platforms=android --org com.proxymama
          
          # Patch android/app/build.gradle to target compileSdk 34 and minSdk 21
          python3 -c "
          import re
          file_path = 'android/app/build.gradle'
          with open(file_path, 'r') as f:
              content = f.read()
          
          # Patch compileSdk & compileSdkVersion
          content = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 34', content)
          content = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 34', content)
          content = re.sub(r'compileSdk\s+33', 'compileSdk 34', content)
          
          # Patch targetSdkVersion
          content = re.sub(r'targetSdkVersion\s+flutter\.targetSdkVersion', 'targetSdkVersion 34', content)
          content = re.sub(r'targetSdkVersion\s*=\s*flutter\.targetSdkVersion', 'targetSdkVersion = 34', content)
          
          # Patch minSdkVersion (Firebase requires at least 21)
          content = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 21', content)
          content = re.sub(r'minSdkVersion\s*=\s*flutter\.minSdkVersion', 'minSdkVersion = 21', content)
          
          with open(file_path, 'w') as f:
              f.write(content)
          print('Successfully patched build.gradle to enforce compileSdk 34, targetSdk 34, minSdk 21')
          "
          
          flutter pub get

      - name: Build APK (Release supporting all ABIs/Architectures)
        run: |
          cd flutter_app
          # Compile with fat APK configuration supporting ARM 32-bit, ARM 64-bit, and x64
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxymama-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
